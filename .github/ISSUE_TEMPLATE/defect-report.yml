name: "[BUG] Rendering or Telemetry Defect"
description: "Report broken SVG rendering, layout clipping, or stale repository metadata."
title: "[BUG]: "
labels: ["defect"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: "01 / Affected Viewport"
      options:
        - "GitHub Dark (#0d1117)"
        - "GitHub Light"
        - "Mobile / Narrow Viewport"
        - "CI Workflow"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: "02 / Observed Behavior"
      description: "Describe the clipping, XML failure, or broken link."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "03 / Expected Specification"
      description: "What should render or pass instead?"
    validations:
      required: true
